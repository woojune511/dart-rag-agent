name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      diff_base_sha:
        description: Base commit SHA for the whitespace diff
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reviewer-contracts:
    name: Reviewer contracts (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: requirements-review.txt

      - name: Run reviewer contract tests
        run: >-
          uv run --python 3.13 --with-requirements requirements-review.txt
          python -m unittest
          tests.test_portfolio_demo
          tests.test_portfolio_review_gates
          tests.test_query_routing_dataset_contract
          tests.test_runtime_domain_term_audit
          tests.test_runtime_topology_doc
          tests.test_validation_workflow_contract

      - name: Audit runtime domain terms
        run: >-
          uv run --python 3.13 --with-requirements requirements-review.txt
          python -m src.ops.audit_runtime_domain_terms

      - name: Run reviewer surface gates
        run: >-
          uv run --python 3.13 --with-requirements requirements-review.txt
          python -m src.ops.portfolio_review_gates

      - name: Check changed patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
          DISPATCH_BASE_SHA: ${{ inputs.diff_base_sha }}
        run: |
          set -euo pipefail

          empty_tree="$(git mktree </dev/null)"

          require_commit() {
            local revision="$1"
            if ! git cat-file -e "${revision}^{commit}" 2>/dev/null; then
              echo "::error::Required commit is not available: ${revision}"
              exit 2
            fi
          }

          is_zero_sha() {
            [[ -n "$1" && "$1" =~ ^0+$ ]]
          }

          case "$EVENT_NAME" in
            pull_request)
              require_commit "$PR_BASE_SHA"
              require_commit "$PR_HEAD_SHA"
              base="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$PUSH_AFTER_SHA"
              if is_zero_sha "$base"; then
                base="$empty_tree"
              else
                require_commit "$base"
              fi
              if is_zero_sha "$head"; then
                head="$empty_tree"
              else
                require_commit "$head"
              fi
              ;;
            workflow_dispatch)
              if [[ ! "$DISPATCH_BASE_SHA" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
                echo "::error::workflow_dispatch requires a full base commit SHA"
                exit 2
              fi
              require_commit "$DISPATCH_BASE_SHA"
              require_commit "$CURRENT_SHA"
              if ! git merge-base --is-ancestor "$DISPATCH_BASE_SHA" "$CURRENT_SHA"; then
                echo "::error::Dispatch base must be an ancestor of the selected ref"
                exit 2
              fi
              base="$DISPATCH_BASE_SHA"
              head="$CURRENT_SHA"
              ;;
            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 2
              ;;
          esac

          echo "Checking whitespace in ${base}..${head}"
          git diff --check "$base" "$head" --

  full-unit-suite:
    name: Full unittest suite (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Run full unittest discovery
        run: >-
          uv run --python 3.13 --with-requirements requirements.txt
          python -m unittest discover -s tests
